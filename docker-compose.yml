services:
  db:
    image: postgres:15-alpine
    container_name: stone_site_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stone_site
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: stone_site_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # ports:  # Убираем, если не нужен доступ снаружи
    #   - "9000:9000"
    #   - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  create-buckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/stone-site-bucket || true;
      mc mb myminio/stone-site-images || true;
      mc anonymous set public myminio/stone-site-bucket;
      mc anonymous set public myminio/stone-site-images;
      echo 'Buckets created successfully!';
      exit 0;
      "

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: stone_site_rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    ports:
      - "5672:5672"    # Порт для подключения приложений
      - "15672:15672"  # Веб-интерфейс RabbitMQ (http://localhost:15672)
    networks:
      - default
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: stone_site_mailhog
    ports:
      - "1025:1025"    # SMTP порт для отправки писем
      - "8025:8025"    # Веб-интерфейс для просмотра писем (http://localhost:8025)
    networks:
      - default

  app:
    build: .
    container_name: stone_site_app
    environment:
      # Database
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: stone_site
      # S3
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: stone-site-bucket
      S3_IMAGES_BUCKET: stone-site-images
      S3_USE_SSL: "false"
      S3_REGION: us-east-1
      # JWT (замените на свои секретные ключи)
      SECRET_KEY: your-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      # Other
      PYTHONPATH: /app

      # RabbitMQ
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      
      # MailHog (SMTP)
      MAIL_SERVER: mailhog
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_USE_TLS: "false"
      MAIL_USE_SSL: "false"
      MAIL_FROM_EMAIL: "noreply@stone-site.com"
      
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn stone_site.main:app --host 0.0.0.0 --port 8000 --reload
      "

volumes:
  postgres_data:
  minio_data: